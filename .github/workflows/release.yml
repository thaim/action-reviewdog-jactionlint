name: release
on:
  push:
    branches: [main]
  pull_request:
    types: [labeled, unlabeled]

permissions: {}

# Do not cancel a release in progress, so that tagpr never stops between tagging and creating the release.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
      issues: read
    uses: thaim/actions/.github/workflows/reusable-release.yml@4291f7f54c1f7b0ebd7e7dc6e86dae3e3163b537 # v3.0.0
    with:
      update_semver_tags: true

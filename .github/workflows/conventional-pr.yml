name: Conventional PR

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional-pr:
    permissions:
      contents: read
      pull-requests: write
    uses: thaim/actions/.github/workflows/reusable-conventional-pr.yml@9badac0deff72950360a1de27ce2d11dfe361437 # v3.2.0

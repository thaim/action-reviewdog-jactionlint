name: Conventional PR

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional-pr:
    permissions:
      contents: read
      pull-requests: write
    uses: thaim/actions/.github/workflows/reusable-conventional-pr.yml@cdcff030309dd82f6ad71e8ca8bd2e98988792a3 # v3.1.0

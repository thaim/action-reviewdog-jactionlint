name: Conventional PR

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional-pr:
    permissions:
      contents: read
      pull-requests: write
    uses: thaim/actions/.github/workflows/reusable-conventional-pr.yml@4291f7f54c1f7b0ebd7e7dc6e86dae3e3163b537 # v3.0.0

name: Test
on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-detect:
    name: runner / jactionlint (detect, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The local reporter needs no token and reports every finding, so the result does not depend on the event.
      # Pass the file explicitly, because jactionlint resolves the project from the git root, not from workdir.
      - id: lint
        uses: ./
        continue-on-error: true
        with:
          workdir: testdata/ng
          jactionlint_flags: .github/workflows/ng.yml
          reporter: local
          filter_mode: nofilter
          fail_level: error
      - name: Assert that jactionlint reported the error
        shell: bash
        env:
          OUTCOME: ${{ steps.lint.outcome }}
        run: |
          if [ "${OUTCOME}" != "failure" ]; then
            echo "::error::expected the action to fail on testdata/ng, got ${OUTCOME}"
            exit 1
          fi

  test-pass:
    name: runner / jactionlint (pass, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          workdir: testdata/ok
          jactionlint_flags: .github/workflows/ok.yml
          profile: correctness
          reporter: local
          filter_mode: nofilter
          fail_level: error

  test-pr-check:
    if: github.event_name == 'pull_request'
    name: runner / jactionlint (github-pr-check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          workdir: testdata/ng
          jactionlint_flags: .github/workflows/ng.yml
          reporter: github-pr-check
          level: warning

  test-pr-review:
    if: github.event_name == 'pull_request'
    name: runner / jactionlint (github-pr-review)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          workdir: testdata/ng
          jactionlint_flags: .github/workflows/ng.yml
          reporter: github-pr-review
          profile: correctness
